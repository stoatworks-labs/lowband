  <body>
    <main id="demo">
      <noscript>
        <h1>Lowband</h1>
        <p>
          An FFGL effect that plays your clip as a Hi8 tape on a Video8 deck.
          The luma is an actual FM carrier: written by Hi8 at 5.7 to 7.7 MHz
          with a 0.47 µs pre-emphasis, read by a Video8 deck's channel, limiter
          and pulse-count demodulator built for 4.2 to 5.4 MHz and a 1.3 µs
          de-emphasis. None of it is painted on. The contrast comes out 5/3 too
          high, a glow trails every highlight, the back-porch clamp lifts the
          black, bright edges throw black streaks where their overshoot leaves
          the deck's band, and under tape noise the highlights break into
          sparkle first. The colour-under chroma is the same in both formats, so
          the colour survives, and a Video8 tape, or a Hi8 deck, plays clean.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser and a port of its
          engine in Web Workers, so it needs JavaScript and WebGL2. The plugin
          itself, its source and its downloads are on
          <a href="https://github.com/stoatworks-labs/lowband">its repository</a>.
        </p>
